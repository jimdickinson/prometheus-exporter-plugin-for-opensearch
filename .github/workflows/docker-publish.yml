name: Build and Push Plugin Docker Image

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Version tag for the Docker image (default is version from gradle.properties)'
        required: false
        type: string
      publish_latest:
        description: 'Also publish as latest tag?'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - os3

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Get version from gradle.properties
        id: get_version
        run: |
          VERSION=$(grep -w "version" gradle.properties | cut -d"=" -f2 | tr -d " ")
          echo "PLUGIN_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Plugin version from gradle.properties: $VERSION"

      - name: Set final image version
        id: set_version
        run: |
          if [ -n "${{ github.event.inputs.tag_version }}" ]; then
            FINAL_VERSION="${{ github.event.inputs.tag_version }}"
            # For manual workflow trigger, use the provided publish_latest input
            PUBLISH_LATEST="${{ github.event.inputs.publish_latest == 'true' }}"
          else
            FINAL_VERSION="${{ env.PLUGIN_VERSION }}"
            # For push to os3 branch, don't publish as latest by default
            PUBLISH_LATEST="false"
          fi
          echo "IMAGE_VERSION=$FINAL_VERSION" >> $GITHUB_ENV
          echo "PUBLISH_LATEST=$PUBLISH_LATEST" >> $GITHUB_ENV
          echo "Using image version: $FINAL_VERSION"
          echo "Publish as latest: $PUBLISH_LATEST"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository_owner }}/prometheus-exporter-plugin
          tags: |
            type=raw,value=${{ env.IMAGE_VERSION }}
            type=raw,value=latest,enable=${{ env.PUBLISH_LATEST == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "Image has been published with the following tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Image digest: ${{ steps.meta.outputs.digest }}"
